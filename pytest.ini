[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    gpu: marks tests that require GPU
    scientific: marks scientific differential tests (T3, fixture-dependent)
    nightly: marks long-running full-fixture tests reserved for nightly runs
    benchmark: marks performance benchmark runs (T4)
    deployment: marks deployment smoke tests booting a real uvicorn server (T6)
